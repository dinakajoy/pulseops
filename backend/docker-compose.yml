services:
  postgres:
    image: postgres:17
    container_name: pulseops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: pulseops
      POSTGRES_USER: pulseops
      POSTGRES_PASSWORD: pulseops

    ports:
      - "5433:5432"

    volumes:
      - pulseops-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseops -d pulseops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pulseops-postgres-data:
